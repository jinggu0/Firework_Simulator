[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firework-simulator"
version = "0.2.0"
description = "Physically based reconstruction of the 2024-10-05 Yeouido fireworks festival"
requires-python = ">=3.11"
dependencies = [
    "astronomy-engine>=2.1,<3",
    "moderngl>=5.12,<6",
    "numpy>=2.0,<3",
    "Pillow>=10,<13",
    "pygame>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["simulator", "simulator.validation"]

[tool.pytest.ini_options]
# Without this, bare `pytest` fails to import `simulator` and only
# `python -m pytest` works, because that form puts the CWD on sys.path.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "opengl: requires an OpenGL context; skipped automatically when unavailable",
]
